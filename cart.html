<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">   
</head>
<body>

<header>
    <h3 class="logo">Harini's Book Store</h3>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="store.html">Store</a></li>
            <li><a href="tracking.html">Track Order</a></li>
            <li><a href="cart.html">Cart</a></li>
        </ul>
    </nav>
</header>

<section class="cart-container">
    <h2>Your Shopping Cart</h2>
    <div id="cartItems"></div>

    <div class="cart-summary">
        <h3 id="totalAmount"></h3>
        <button class="checkout-btn" id="checkoutBtn">Proceed to Checkout</button>
    </div>
</section>

<script>

function getCart() {
    return JSON.parse(localStorage.getItem("cart")) || [];
}

function saveCart(cart) {
    localStorage.setItem("cart", JSON.stringify(cart));
}

function loadCart() {
    const cart = getCart();
    const cartItemsDiv = document.getElementById("cartItems");
    const totalAmount = document.getElementById("totalAmount");

    cartItemsDiv.innerHTML = "";
    let total = 0;

    if (cart.length === 0) {
        cartItemsDiv.innerHTML = "<p class='empty'>Your cart is empty.</p>";
        totalAmount.innerText = "";
        return;
    }

    cart.forEach((item, index) => {
        const quantity = item.quantity || 1;
        const itemTotal = item.price * quantity;
        total += itemTotal;

        const div = document.createElement("div");
        div.className = "cart-item";

        div.innerHTML = `
            <div>
                <p class="book-name">${item.name}</p>
                <p>Price: ₹${item.price}</p>
                <p>
                    Quantity:
                    <button class="decrease">-</button>
                    ${quantity}
                    <button class="increase">+</button>
                </p>
            </div>
            <div>
                <p>Subtotal: ₹${itemTotal}</p>
                <button class="remove-btn">Remove</button>
            </div>
        `;

        
        div.querySelector(".increase").onclick = () => changeQty(index, 1);
        div.querySelector(".decrease").onclick = () => changeQty(index, -1);
        div.querySelector(".remove-btn").onclick = () => removeItem(index);

        cartItemsDiv.appendChild(div);
    });

    totalAmount.innerText = "Total Amount: ₹" + total;
}

function changeQty(index, change) {
    const cart = getCart();

    cart[index].quantity = (cart[index].quantity || 1) + change;

    if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
    }

    saveCart(cart);
    loadCart();
}

function removeItem(index) {
    const cart = getCart();
    cart.splice(index, 1);
    saveCart(cart);
    loadCart();
}

document.getElementById("checkoutBtn").onclick = () => {
    const cart = getCart();

    if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }

    window.location.href = "checkout.html";
};

loadCart();

</script>

</body>
</html>
