<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
</head>

<body>

<header>
    <h3 class="logo">Place Your Order</h3>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="store.html">Store</a></li>
            <li><a href="cart.html">Cart</a></li>
        </ul>
    </nav>
</header>

<main>

<section class="checkout-form">
    <form id="orderForm">

        <label>Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="10-digit number" pattern="[0-9]{10}" required>

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label>Delivery Address</label>
        <textarea id="address" placeholder="Enter full address" required></textarea>

        <label>Mode of Payment</label>
        <select id="payment">
            <option value="UPI">UPI</option>
            <option value="Credit Card">Credit Card</option>
            <option value="Cash on Delivery">Cash On Delivery</option>
        </select>

        <button type="submit">Place Your Order</button>

    </form>
</section>

<div class="order-confirmation" id="confirmation" style="display:none;">
    <h2>Order Placed Successfully 🎉</h2>
    <p><strong>Order ID:</strong> <span id="orderId"></span></p>
    <p>Status: Ordered</p>
    <a href="tracking.html">Track Your Order</a>
</div>

</main>

<script>

const form = document.getElementById("orderForm");

form.addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const email = document.getElementById("email").value.trim();
    const address = document.getElementById("address").value.trim();
    const payment = document.getElementById("payment").value;

    if (phone.length !== 10) {
        alert("Enter a valid 10-digit phone number");
        return;
    }

    const orderId = "ORD" + Date.now();

    const orderDetails = {
        orderId,
        name,
        phone,
        email,
        address,
        payment,
        status: "Ordered"
    };

    localStorage.setItem("order_" + orderId, JSON.stringify(orderDetails));
    localStorage.removeItem("cart");

    document.getElementById("orderId").innerText = orderId;
    document.getElementById("confirmation").style.display = "block";

    form.reset();
});

</script>

</body>
</html>
